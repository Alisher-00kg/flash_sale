services:
  postgres:
    image: postgres:16
    container_name: flash-sale-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flash_sale
      POSTGRES_PASSWORD: flash_sale
      POSTGRES_DB: flash_sale
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: